[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plot-world-model"
version = "0.1.0"
description = "Portable training code for PLOT multi-inhabitant world models"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4",
  "opencv-python-headless==4.11.0.86",
  "einops==0.8.1",
  "timm==1.0.27",
  "loguru==0.7.3",
  "safetensors==0.8.0",
  "wandb==0.28.1",
]

[tool.setuptools.packages.find]
include = ["plot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
